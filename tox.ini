[tox]
env_list =
    ; Wagtail 7.0: Django 4.2, 5.1, 5.2 | Python 3.10-3.13
    py{310,311,312}-django42-wagtail70
    py{310,311,312,313}-django51-wagtail70
    py{310,311,312,313}-django52-wagtail70
    ; Wagtail 7.1: Django 4.2, 5.1, 5.2 | Python 3.10-3.13
    py{310,311,312}-django42-wagtail71
    py{310,311,312,313}-django51-wagtail71
    py{310,311,312,313}-django52-wagtail71
    ; Wagtail 7.2: Django 4.2, 5.1, 5.2, 6.0 | Python 3.10-3.14
    py{310,311,312}-django42-wagtail72
    py{310,311,312,313}-django51-wagtail72
    py{310,311,312,313,314}-django52-wagtail72
    py{312,313,314}-django60-wagtail72
    ; Wagtail 7.3: Django 4.2, 5.2, 6.0 | Python 3.10-3.14
    py{310,311,312}-django42-wagtail73
    py{310,311,312,313,314}-django52-wagtail73
    py{312,313,314}-django60-wagtail73
labels =
    smoke = py310-django42-wagtail70, py313-django52-wagtail73, py314-django60-wagtail73

[testenv]
deps =
    django42: django>=4.2,<4.3
    django51: django>=5.1,<5.2
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    wagtail70: wagtail>=7.0,<7.1
    wagtail71: wagtail>=7.1,<7.2
    wagtail72: wagtail>=7.2,<7.3
    wagtail73: wagtail>=7.3,<7.4
    wagtail-modeladmin>=2.2.0
set_env =
    DJANGO_SETTINGS_MODULE = sandbox.settings
    PYTHONPATH = {toxinidir}
commands =
    django-admin test tests {posargs}

[testenv:coverage]
deps =
    django>=5.2,<5.3
    wagtail>=7.3,<7.4
    wagtail-modeladmin>=2.2.0
    coverage[toml]>=7.0
set_env =
    DJANGO_SETTINGS_MODULE = sandbox.settings
    PYTHONPATH = {toxinidir}
commands =
    coverage run -m django test tests {posargs}
    coverage report

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
