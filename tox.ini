[tox]
env_list =
    ; Wagtail 8.0: Django 5.2, 6.0, 6.1 | Python 3.10-3.14
    py{310,311,312,313,314}-django52-wagtail80
    py{312,313,314}-django60-wagtail80
    py{312,313,314}-django61-wagtail80
labels =
    smoke = py310-django52-wagtail80, py313-django60-wagtail80, py314-django61-wagtail80

[testenv]
deps =
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
    wagtail80: wagtail>=8.0,<8.1
    wagtail-modeladmin>=2.5.0
set_env =
    DJANGO_SETTINGS_MODULE = sandbox.settings
    PYTHONPATH = {toxinidir}
commands =
    django-admin test tests {posargs}

[testenv:coverage]
deps =
    django>=5.2,<5.3
    wagtail>=8.0,<8.1
    wagtail-modeladmin>=2.5.0
    coverage[toml]>=7.0
set_env =
    DJANGO_SETTINGS_MODULE = sandbox.settings
    PYTHONPATH = {toxinidir}
commands =
    coverage run -m django test tests {posargs}
    coverage report

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
