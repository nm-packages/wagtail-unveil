name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          NORMALIZED_TAG="${RELEASE_TAG#v}"

          if [ "${NORMALIZED_TAG}" != "${PACKAGE_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match project version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Validate release commit is on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          RELEASE_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"

          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "Release tag ${RELEASE_TAG} points to commit ${RELEASE_SHA}, which is not contained in origin/main."
            exit 1
          fi

      - name: Build source distribution and wheel
        run: uv build --sdist --wheel --out-dir dist

      - name: Validate built artifacts
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
