[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-unveil"
version = "0.1.0a5"
description = "Discover and test all URLs in your Wagtail site — frontend and admin."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Nick Moreton" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=4.2",
    "tomli>=2.0.0; python_version < '3.11'",
    "wagtail>=7.0",
]

[project.urls]
Homepage = "https://github.com/nm-packages/wagtail-unveil"
Source = "https://github.com/nm-packages/wagtail-unveil"
Issues = "https://github.com/nm-packages/wagtail-unveil/issues"
Documentation = "https://nm-packages.github.io/wagtail-unveil/"

[tool.hatch.build.targets.wheel]
packages = ["wagtail_unveil"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"sandbox/settings.py" = ["F403"]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "tox>=4.44.0",
    "tox-gh-actions>=3.3.0",
    "tox-uv>=1.29.0",
    "wagtail-modeladmin>=2.2.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "pymdown-extensions>=10.0.0",
]

[tool.coverage.run]
source = ["wagtail_unveil"]
omit = [
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
