{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} — wagtail-unveil</title>
    <link rel="stylesheet" href="{% static 'wagtail_unveil/css/admin_urls_report.css' %}">
</head>
<body data-api-url="{{ api_url|default:'' }}" data-report-kind="{{ report_kind|default:'' }}">
    <nav class="report-nav">
        <a href="/">Home</a>
        <a class="{% block admin_nav_class %}{% endblock %}" href="{% url 'wagtail_unveil:report_backend_urls' %}">Admin URLs</a>
        <a class="{% block frontend_nav_class %}{% endblock %}" href="{% url 'wagtail_unveil:report_frontend_urls' %}">Frontend URLs</a>
        <a href="{% url 'wagtailadmin_home' %}">Wagtail Admin</a>
    </nav>
    <div class="container">
        <h1>{% block heading %}{% endblock %}</h1>
        <p class="summary">
            {% block summary %}{% endblock %}
        </p>
        <p class="report-feedback" id="report-loading">Loading report data…</p>
        <p class="report-feedback report-feedback-error hidden" id="report-error" role="alert"></p>

        <div class="filters">
            <unveil-search-input placeholder="{% block search_placeholder %}{% endblock %}"></unveil-search-input>
            <unveil-toggle-untestable-button></unveil-toggle-untestable-button>
            <unveil-test-all-button></unveil-test-all-button>
            <unveil-pause-button></unveil-pause-button>
            <unveil-cancel-button></unveil-cancel-button>
            <unveil-help-button></unveil-help-button>
            <unveil-reset-button></unveil-reset-button>
        </div>
        <p class="test-all-summary hidden" id="test-all-summary"></p>

        {% block help_panel %}{% endblock %}

        {% block table %}{% endblock %}
    </div>

    <script src="{% static 'wagtail_unveil/js/report_core.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_filters.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_sorting.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_row_actions.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_batch_runner.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_components.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_data.js' %}"></script>
    <script src="{% static 'wagtail_unveil/js/report_bootstrap.js' %}"></script>
</body>
</html>
