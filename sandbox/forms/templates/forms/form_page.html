{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}template-formpage{% endblock %}

{% block content %}
<h1>{{ page.title }}</h1>

{% if page.intro %}
    {{ page.intro|richtext }}
{% endif %}

<form action="{% pageurl page %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Submit">
</form>
{% endblock content %}
